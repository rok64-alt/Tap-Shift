<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Shift</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111111;
            font-family: Arial, sans-serif;
            font-weight: normal;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Lock to a perfect phone screen aspect ratio centered on screen */
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 375px;
            height: 100%;
            max-height: 667px;
            background-color: #000000;
            border: 1px solid #333333;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* UI Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 20;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        #score {
            font-size: 32px;
        }

        /* Standardized simple text styles */
        h1 {
            font-size: 36px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        .best-score {
            font-size: 16px;
            color: #888888;
            margin-top: 15px;
        }
        .gameover-text {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .final-score-text {
            font-size: 18px;
            color: #888888;
            margin-bottom: 25px;
        }

        /* Leaderboard Container */
        .leaderboard {
            width: 240px;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: left;
        }
        .leaderboard-title {
            text-align: center;
            color: #888888;
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-size: 12px;
        }
        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #222222;
        }
        .row-highlight {
            color: #ff4d4d;
        }

        /* Simple Buttons */
        .btn {
            background: none;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            padding: 10px 24px;
            cursor: pointer;
            outline: none;
            width: 180px;
            text-align: center;
        }
        .btn:active {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Live HUD Score -->
        <div id="hud">
            <div id="score">0</div>
        </div>

        <!-- Main Menu Screen -->
        <div id="menuScreen" class="screen">
            <h1>TAP SHIFT</h1>
            <button class="btn" id="playBtn">PLAY</button>
            <div class="best-score" id="menuBest">BEST: 0</div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen" style="display: none;">
            <div class="gameover-text">GAME OVER</div>
            <div class="final-score-text" id="finalScore">SCORE: 0</div>

            <!-- Leaderboard list -->
            <div class="leaderboard" id="leaderboardArea">
                <div class="leaderboard-title">GLOBAL LEADERBOARD</div>
                <div id="leaderboardList">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <button class="btn" id="retryBtn" style="margin-bottom: 8px;">RETRY</button>
            <button class="btn" id="menuBtn">MENU</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');
        const scoreElement = document.getElementById('score');
        
        // Screens
        const menuScreen = document.getElementById('menuScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        
        // Buttons & text
        const playBtn = document.getElementById('playBtn');
        const retryBtn = document.getElementById('retryBtn');
        const menuBtn = document.getElementById('menuBtn');
        const menuBestText = document.getElementById('menuBest');
        const finalScoreText = document.getElementById('finalScore');
        const leaderboardList = document.getElementById('leaderboardList');

        let width, height;
        let lineTopY, lineBottomY, laneYCoordinates;
        
        // Game parameters
        let state = 'menu'; // 'menu', 'playing', 'gameover'
        let score = 0;
        let highScore = localStorage.getItem('tapshift_highscore') ? parseInt(localStorage.getItem('tapshift_highscore')) : 0;
        let obstacles = [];
        let spawnTimer = 0;
        let spawnInterval = 32; // Fast action
        let gameSpeed = 6;     // Fast movement speed
        let lastScoreTime = 0; 
        let lastLane = -1;

        // Track consecutive spawns for each lane [top, middle, bottom]
        let consecutiveSpawns = [0, 0, 0]; 

        // Player configuration
        let playerLane = 1; // 0 = Top, 1 = Middle, 2 = Bottom
        let currentPlayerY = 0; 
        const playerRadius = 15;
        const obstacleSize = 40;

        // Firebase & Global Leaderboard Setup
        let db, auth;
        let isFirebaseInitialized = false;
        let currentUserId = null;
        let myAssignedName = localStorage.getItem('tapshift_assigned_name');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tap-shift';

        // Generate an automatic random user identity if none exists
        if (!myAssignedName) {
            myAssignedName = `USER-${Math.floor(100 + Math.random() * 900)}`;
            localStorage.setItem('tapshift_assigned_name', myAssignedName);
        }

        if (typeof __firebase_config !== 'undefined') {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isFirebaseInitialized = true;
            } catch (e) {
                console.error("Firebase config parsing failed", e);
            }
        }

        // Initialize Anonymous Auth instantly on start
        if (isFirebaseInitialized) {
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.error("Auth failed", err);
                }
            };
            initAuth();
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUserId = user.uid;
                    loadLeaderboard();
                }
            });
        }

        function resize() {
            width = canvas.width = container.clientWidth;
            height = canvas.height = container.clientHeight;

            // Split the height into 3 equal lanes
            lineTopY = height / 3;
            lineBottomY = (height / 3) * 2;

            laneYCoordinates = [
                height / 6,          // Center of Top lane
                height / 2,          // Center of Middle lane
                (height / 6) * 5     // Center of Bottom lane
            ];

            // Set initial position if not actively playing
            if (state !== 'playing') {
                currentPlayerY = laneYCoordinates[playerLane];
            }
        }
        
        window.addEventListener('resize', resize);
        resize();

        // Update High Score displays
        function updateHighScoreDisplays() {
            menuBestText.textContent = `BEST: ${highScore}`;
        }
        updateHighScoreDisplays();

        // Load Global Leaderboard from Firestore database
        async function loadLeaderboard() {
            if (!isFirebaseInitialized || !auth.currentUser) {
                // Offline fallback list
                renderLeaderboard([
                    { name: "USER-482", score: 38 },
                    { name: "USER-109", score: 24 },
                    { name: "USER-721", score: 15 }
                ]);
                return;
            }

            try {
                const scoresCol = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
                const querySnapshot = await getDocs(scoresCol);
                const fetchedScores = [];
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data && data.name && data.score !== undefined) {
                        fetchedScores.push({ 
                            name: data.name, 
                            score: data.score,
                            isMe: doc.id === currentUserId
                        });
                    }
                });

                // Sort descending and keep the global top 5
                fetchedScores.sort((a, b) => b.score - a.score);
                renderLeaderboard(fetchedScores.slice(0, 5));
            } catch (err) {
                console.error("Error loading scores", err);
            }
        }

        function renderLeaderboard(list) {
            leaderboardList.innerHTML = '';
            if (list.length === 0) {
                leaderboardList.innerHTML = '<div style="color: #444; font-size: 12px; text-align: center;">No scores posted yet</div>';
                return;
            }
            list.forEach((entry, idx) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row' + (entry.isMe ? ' row-highlight' : '');
                
                // Show their assigned ID, highlight if it's the current player
                const displayName = entry.isMe ? `${entry.name} (YOU)` : entry.name;
                row.innerHTML = `<span>${idx + 1}. ${displayName}</span><span>${entry.score}</span>`;
                leaderboardList.appendChild(row);
            });
        }

        // Post score to Firestore automatically without prompting the user
        async function autoPostScore() {
            if (!isFirebaseInitialized || !auth.currentUser) return;

            try {
                const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'scores', currentUserId);
                await setDoc(userDoc, {
                    name: myAssignedName,
                    score: score,
                    timestamp: Date.now()
                });
            } catch (err) {
                console.error("Error posting score", err);
            }
        }

        // Handle direct lane selection when playing
        function handlePlayInput(clientY) {
            const rect = canvas.getBoundingClientRect();
            const clickY = clientY - rect.top;

            // Determine which lane was tapped and move directly to it
            if (clickY < lineTopY) {
                playerLane = 0; // Directly to Top Lane
            } else if (clickY > lineBottomY) {
                playerLane = 2; // Directly to Bottom Lane
            } else {
                playerLane = 1; // Directly to Middle Lane
            }
        }

        // Menu Button Interactions
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        retryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showMenu();
        });

        // Click on the game container
        container.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (state === 'playing') {
                handlePlayInput(e.clientY);
            }
        });

        function showMenu() {
            state = 'menu';
            obstacles = [];
            playerLane = 1;
            currentPlayerY = laneYCoordinates[1];
            updateHighScoreDisplays();
            
            hud.style.display = 'none';
            gameOverScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        }

        function startGame() {
            state = 'playing';
            score = 0;
            obstacles = [];
            playerLane = 1;
            currentPlayerY = laneYCoordinates[1];
            spawnTimer = 0;
            gameSpeed = 6;
            consecutiveSpawns = [0, 0, 0];
            spawnInterval = 32;
            lastScoreTime = Date.now(); 
            lastLane = -1;
            
            scoreElement.textContent = score;

            menuScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            hud.style.display = 'block';
        }

        async function triggerGameOver() {
            state = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('tapshift_highscore', highScore);
            }

            finalScoreText.textContent = `SCORE: ${score}`;
            
            // Post score automatically as your assigned anonymous profile (e.g. USER-482)
            await autoPostScore();
            
            updateHighScoreDisplays();
            loadLeaderboard();

            hud.style.display = 'none';
            gameOverScreen.style.display = 'flex';
        }

        function update() {
            // Draw pure black background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // Draw two horizontal white dividing lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(0, lineTopY);
            ctx.lineTo(width, lineTopY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, lineBottomY);
            ctx.lineTo(width, lineBottomY);
            ctx.stroke();

            // Screen Wrap-Around Movement Logic:
            const targetY = laneYCoordinates[playerLane];
            let diffY = targetY - currentPlayerY;

            // Shortest wrapping path calculation
            if (diffY > height / 2) {
                diffY -= height;
            } else if (diffY < -height / 2) {
                diffY += height;
            }

            // Apply smooth easing
            currentPlayerY += diffY * 0.22;

            // Wrap coordinates
            if (currentPlayerY < 0) {
                currentPlayerY += height;
            } else if (currentPlayerY > height) {
                currentPlayerY -= height;
            }

            // Draw player dot (Exactly in horizontal center of the screen)
            const playerX = width / 2;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(playerX, currentPlayerY, playerRadius, 0, Math.PI * 2);
            ctx.fill();

            // Seamless boundary crossing drawing
            if (currentPlayerY < playerRadius) {
                ctx.beginPath();
                ctx.arc(playerX, currentPlayerY + height, playerRadius, 0, Math.PI * 2);
                ctx.fill();
            } else if (currentPlayerY > height - playerRadius) {
                ctx.beginPath();
                ctx.arc(playerX, currentPlayerY - height, playerRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            if (state === 'playing') {
                // Score survival tracker: increment by 1 every 1 second (1000ms)
                const now = Date.now();
                if (now - lastScoreTime >= 1000) {
                    score++;
                    scoreElement.textContent = score;
                    lastScoreTime = now;
                    gameSpeed += 0.15; // Gradually speed up the obstacles over time
                }

                // Spawn red squares from the right side
                spawnTimer++;
                if (spawnTimer >= spawnInterval) {
                    
                    // Look ahead: find lanes currently blocked by active incoming obstacles
                    let incomingLanes = new Set();
                    for (let obs of obstacles) {
                        if (obs.x > playerX - 50) {
                            incomingLanes.add(obs.lane);
                        }
                    }

                    let lanesToSpawn = [];

                    if (incomingLanes.size === 2) {
                        // Keep at least one lane 100% open by matching an already blocked lane
                        const blockedArray = Array.from(incomingLanes);
                        const chosenLane = blockedArray[Math.floor(Math.random() * blockedArray.length)];
                        lanesToSpawn.push(chosenLane);
                    } else if (incomingLanes.size === 1) {
                        const blockedLane = Array.from(incomingLanes)[0];
                        const otherLanes = [0, 1, 2].filter(l => l !== blockedLane);
                        
                        const spawnDouble = Math.random() < 0.4;
                        if (spawnDouble) {
                            const secondLane = otherLanes[Math.floor(Math.random() * 2)];
                            lanesToSpawn.push(blockedLane, secondLane);
                        } else {
                            let lane = Math.floor(Math.random() * 3);
                            if (lane === lastLane && consecutiveSpawns[lane] >= 1) {
                                lane = (lane + 1) % 3;
                            }
                            lanesToSpawn.push(lane);
                        }
                    } else {
                        const spawnDouble = Math.random() < 0.4;
                        if (spawnDouble) {
                            const openLane = Math.floor(Math.random() * 3);
                            lanesToSpawn = [0, 1, 2].filter(l => l !== openLane);
                        } else {
                            let lane = Math.floor(Math.random() * 3);
                            if (lane === lastLane && consecutiveSpawns[lane] >= 1) {
                                lane = (lane + 1) % 3;
                            }
                            lanesToSpawn.push(lane);
                        }
                    }

                    // Process and add the chosen lanes
                    lanesToSpawn.forEach(lane => {
                        obstacles.push({
                            lane: lane,
                            x: width + obstacleSize
                        });
                        consecutiveSpawns[lane]++;
                    });

                    for (let l = 0; l < 3; l++) {
                        if (!lanesToSpawn.includes(l)) {
                            consecutiveSpawns[l] = 0;
                        }
                    }

                    if (lanesToSpawn.length === 1) {
                        lastLane = lanesToSpawn[0];
                    }

                    spawnTimer = 0;
                    spawnInterval = Math.max(22, 32 - Math.floor(score / 4));
                }

                // Update and draw obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.x -= gameSpeed;

                    const obsY = laneYCoordinates[obs.lane];

                    // Draw Red Gradient Square
                    const startX = obs.x - obstacleSize / 2;
                    const startY = obsY - obstacleSize / 2;
                    const grad = ctx.createLinearGradient(startX, startY, startX + obstacleSize, startY + obstacleSize);
                    grad.addColorStop(0, '#ff4d4d');
                    grad.addColorStop(1, '#800000');
                    
                    ctx.fillStyle = grad;
                    ctx.fillRect(startX, startY, obstacleSize, obstacleSize);

                    // Collision checking (Standard + wrapped coordinates)
                    const distX = Math.abs(obs.x - playerX);
                    const distY = Math.abs(obsY - currentPlayerY);
                    
                    const collisionLimitX = (obstacleSize / 2) + playerRadius;
                    const collisionLimitY = (obstacleSize / 2) + playerRadius;

                    const collidesNormal = (distX < collisionLimitX && distY < collisionLimitY);
                    const collidesWrappedTop = (distX < collisionLimitX && Math.abs(obsY - (currentPlayerY + height)) < collisionLimitY);
                    const collidesWrappedBottom = (distX < collisionLimitX && Math.abs(obsY - (currentPlayerY - height)) < collisionLimitY);

                    if (collidesNormal || collidesWrappedTop || collidesWrappedBottom) {
                        triggerGameOver();
                    }

                    // Clean up off-screen obstacles
                    if (obs.x + obstacleSize < 0) {
                        obstacles.splice(i, 1);
                    }
                }
            } else if (state === 'gameover') {
                // Static render of obstacles on Game Over
                for (let i = 0; i < obstacles.length; i++) {
                    const obs = obstacles[i];
                    const obsY = laneYCoordinates[obs.lane];
                    const startX = obs.x - obstacleSize / 2;
                    const startY = obsY - obstacleSize / 2;
                    
                    const grad = ctx.createLinearGradient(startX, startY, startX + obstacleSize, startY + obstacleSize);
                    grad.addColorStop(0, '#ff4d4d');
                    grad.addColorStop(1, '#800000');
                    
                    ctx.fillStyle = grad;
                    ctx.fillRect(startX, startY, obstacleSize, obstacleSize);
                }
            }

            requestAnimationFrame(update);
        }

        // Initialize position on load
        currentPlayerY = laneYCoordinates[playerLane];
        update();
    </script>
</body>
</html>
